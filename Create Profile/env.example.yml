# env.example.yml — template for per-client Databricks CLI profile settings.
#
# To use it:
#   1. Copy this file to env.yml (env.yml is git-ignored and never committed):
#        cp env.example.yml env.yml
#   2. Fill in each client's workspace host and credentials.
#   3. Run ./create-profiles.sh
#
# Two ways to supply a credential:
#   a) RECOMMENDED — store only the NAME of an environment variable in the
#      *_env key, then export the actual value in your shell before running
#      the script (secrets stay out of the file):
#        client_secret_env: CLIENTB_DATABRICKS_CLIENT_SECRET
#   b) Directly in env.yml (convenient for local testing, but never commit it):
#        client_secret: <paste-secret-here>

clients:
  # Profile name — becomes the section name in ~/.databrickscfg and must match
  # the 'profile' referenced by that client's target in databricks.yml.
  ClientA:
    host: https://dbc-xxxxxxxx-xxxx.cloud.databricks.com
    auth_type: service_principal
    client_id: <paste-client-id-here>
    client_secret: <paste-client-secret-here>

  clientB:
    host: https://dbc-yyyyyyyy-yyyy.cloud.databricks.com
    auth_type: service_principal
    # Recommended: reference env vars instead of pasting secrets
    client_id_env: CLIENTB_DATABRICKS_CLIENT_ID
    client_secret_env: CLIENTB_DATABRICKS_CLIENT_SECRET
